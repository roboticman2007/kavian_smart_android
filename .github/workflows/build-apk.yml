name: Build Kavian Smart Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Installable APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PROJ_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)")
          if [ -z "$PROJ_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found in repository!"
            ls -la
            exit 1
          fi
          echo "Building Android project in: $PROJ_DIR"
          cd "$PROJ_DIR"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/kavian-release.jks
            export KEYSTORE_FILE="kavian-release.jks"
          else
            export KEYSTORE_FILE=""
          fi

          gradle assembleRelease --no-daemon
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" "$GITHUB_WORKSPACE/KavianSmart-v1.0.apk"

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavianSmart-Android-APK-v1.0
          path: KavianSmart-v1.0.apk
          retention-days: 90
